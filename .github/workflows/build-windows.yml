name: Construire l'application Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Créer l'installateur Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier les fichiers nécessaires
        shell: pwsh
        run: |
          $requiredFiles = @(
            "package.json",
            "index.html",
            "style.css",
            "app.js",
            "manifest.json",
            "electron-main.js"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Fichier manquant : $file"
            }
          }

          foreach ($directory in @("images", "audios")) {
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "Le dossier $directory est absent."
            }
          }

      - name: Installer les dépendances
        shell: pwsh
        run: npm ci

      - name: Construire l'application Windows
        shell: pwsh
        run: npm run build:windows

      - name: Vérifier l'installateur Windows
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path "dist" -Filter "*.exe" -File -ErrorAction SilentlyContinue

          if (-not $installers) {
            throw "Aucun installateur Windows (.exe) n'a été généré dans le dossier dist."
          }

          $installers | ForEach-Object {
            Write-Host "Installateur généré : $($_.FullName)"
          }

      - name: Publier l'installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: Chansons-d-Amour-Windows
          path: dist/*.exe
          if-no-files-found: error
