name: Construire l'application Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les fichiers de l'application
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json service-worker.js www/
          cp -r images www/images
          cp -r audios www/audios

      - name: Vérifier la configuration Capacitor
        run: |
          node -e "const c=require('./capacitor.config.json'); if(c.webDir!=='www') process.exit(1); console.log('Configuration Capacitor correcte')"

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Chansons-d-Amour-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
