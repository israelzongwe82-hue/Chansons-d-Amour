name: Construire l'application Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurer Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Installer les composants Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances Node.js
        run: npm install

      - name: Vérifier les fichiers du projet
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f style.css
          test -f app.js
          test -f manifest.json
          test -f service-worker.js
          test -d images
          test -d audios

      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json service-worker.js www/
          cp -r images www/images
          cp -r audios www/audios

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Chansons-d-Amour-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
